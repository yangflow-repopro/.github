name: Docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-docs:
    name: Documents match the templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-docs.py .
      - name: Test the documentation checker
        run: python3 scripts/test_check_docs.py
      - name: Test the design review tool
        run: python3 scripts/test_design_review.py
