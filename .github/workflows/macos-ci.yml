# Reusable CI for the organization's macOS apps. See handbook/code-standards.md, "CI".
#
# Caller (in <repo>/.github/workflows/ci.yml):
#   jobs:
#     ci:
#       uses: yangflow-repopro/.github/.github/workflows/macos-ci.yml@main
#       with:
#         project: <Name>.xcodeproj
#         scheme: <Name>
#         lint-paths: <Name> <Name>Core <Name>Tests
#         run-compat: ${{ github.event_name == 'push' }}
name: macOS CI

on:
  workflow_call:
    inputs:
      project:
        description: Path of the .xcodeproj
        required: true
        type: string
      scheme:
        description: Scheme to build and test
        required: true
        type: string
      lint-paths:
        description: Space-separated directories for swift-format lint
        required: true
        type: string
      test-args:
        description: Extra arguments appended to xcodebuild test
        required: false
        type: string
        default: ""
      run-compat:
        description: Also run the GitHub-hosted compatibility job (costly; callers enable it on push to main)
        required: false
        type: boolean
        default: false
      compat-xcode:
        description: Xcode version selected on the macos-26 runner
        required: false
        type: string
        default: "26.6"

jobs:
  # macOS minutes cost ten times Linux minutes. A pull request that only touches documents, design files,
  # scripts that CI does not run or website-facing text does not need Xcode: this cheap job decides.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "origin/$BASE...HEAD")"
          # Anything that is not plain documentation or design material can change the build.
          if echo "$files" | grep -Evq '^(docs/|design/|README\.md$|AGENTS\.md$|CLAUDE\.md$|GEMINI\.md$|SECURITY\.md$|CHANGELOG(\.zh)?\.md$|THIRD_PARTY\.md$|LICENSE$|\.claude/|\.codex/|\.github/(copilot-instructions\.md|dependabot\.yml|pull_request_template\.md)$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "Only documents changed: the Xcode jobs are skipped."
          fi

  main:
    name: Current Xcode · xcodegen, format, build, test
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Tool versions
        run: xcodebuild -version && swift --version

      - name: XcodeGen
        run: command -v xcodegen > /dev/null || brew install xcodegen; xcodegen --version

      - name: Project is up to date
        run: |
          xcodegen generate --quiet
          git diff --exit-code -- '*.xcodeproj' || {
            echo "::error::project.yml changed but the generated project was not committed; run xcodegen generate"; exit 1; }

      - name: Format check
        run: xcrun swift-format lint --strict --recursive --parallel ${{ inputs.lint-paths }}

      - name: Resolve packages (retried; the Sparkle binary download is occasionally refused)
        run: |
          for attempt in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project "${{ inputs.project }}" -scheme "${{ inputs.scheme }}" && exit 0
            echo "attempt $attempt failed; retrying in 20s"; sleep 20
          done
          exit 1

      - name: Release script tests
        run: |
          if [ -x scripts/test-release.sh ]; then scripts/test-release.sh; fi

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build -project "${{ inputs.project }}" -scheme "${{ inputs.scheme }}" \
            -configuration Release -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test -project "${{ inputs.project }}" -scheme "${{ inputs.scheme }}" \
            -destination 'platform=macOS' -testLanguage en -testRegion US \
            CODE_SIGNING_ALLOWED=NO ${{ inputs.test-args }}

  compat:
    name: macOS 26 · build, test (compatibility)
    needs: changes
    if: ${{ inputs.run-compat && needs.changes.outputs.build == 'true' }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode ${{ inputs.compat-xcode }}
        run: sudo xcode-select -s "/Applications/Xcode_${{ inputs.compat-xcode }}.app" && xcodebuild -version

      - name: Resolve packages (retried; the Sparkle binary download is occasionally refused)
        run: |
          for attempt in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project "${{ inputs.project }}" -scheme "${{ inputs.scheme }}" && exit 0
            echo "attempt $attempt failed; retrying in 20s"; sleep 20
          done
          exit 1

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild build -project "${{ inputs.project }}" -scheme "${{ inputs.scheme }}" \
            -configuration Release -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Test
        # COMPAT_RUN=1 reaches the tests as an environment variable; suites that need real sockets or
        # WebKit are disabled with it (handbook/code-standards.md, Tests). The hosted macOS 26 image is
        # unreliable for them; the main job still runs everything.
        env:
          TEST_RUNNER_COMPAT_RUN: "1"
        run: |
          set -o pipefail
          xcodebuild test -project "${{ inputs.project }}" -scheme "${{ inputs.scheme }}" \
            -destination 'platform=macOS' -testLanguage en -testRegion US \
            CODE_SIGNING_ALLOWED=NO ${{ inputs.test-args }}
