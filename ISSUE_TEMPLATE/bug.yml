name: Bug
description: Something does not behave as the spec or design says
labels: ["fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: One or two sentences; attach a screenshot or recording for UI issues.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Quote the spec or design section if there is one.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      render: markdown
  - type: input
    id: version
    attributes:
      label: Project version or commit and environment
      placeholder: "1.0.0 / commit SHA · OS, browser or runtime version"
